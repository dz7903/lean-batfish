!
hostname gwc
!
! IKE phase 1: how gwc and gwa authenticate each other.
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring KEYRING-A
  pre-shared-key address 203.0.113.1 key site-to-site-secret
  local-address 198.51.100.1
!
crypto isakmp profile TO-A
   keyring KEYRING-A
   match identity address 203.0.113.1 255.255.255.255
   local-address 198.51.100.1
!
! IPsec phase 2: how packets between the sites are protected.
crypto ipsec transform-set AES256-SHA256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile SITE-VPN
 set transform-set AES256-SHA256
 set pfs group14
!
interface Tunnel0
 description IPsec tunnel to site A
 ip address 172.16.0.2 255.255.255.252
 tunnel source 198.51.100.1
 tunnel mode ipsec ipv4
 tunnel destination 203.0.113.1
 tunnel protection ipsec profile SITE-VPN
!
interface GigabitEthernet0/0
 description to provider B (b2)
 ip address 198.51.100.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to site C (c1)
 ip address 10.3.0.1 255.255.255.252
!
! Everything else goes to the provider.
ip route 0.0.0.0 0.0.0.0 198.51.100.2
! Site C.
ip route 10.3.0.0 255.255.0.0 10.3.0.2
! Site A, through the tunnel; never to the provider in the clear.
ip route 10.1.0.0 255.255.0.0 Tunnel0
ip route 10.1.0.0 255.255.0.0 Null0 250
!
end
