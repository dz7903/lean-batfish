!
hostname gwa
!
! IKE phase 1: how gwa and gwc authenticate each other.
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring KEYRING-C
  pre-shared-key address 198.51.100.1 key site-to-site-secret
  local-address 203.0.113.1
!
crypto isakmp profile TO-C
   keyring KEYRING-C
   match identity address 198.51.100.1 255.255.255.255
   local-address 203.0.113.1
!
! IPsec phase 2: how packets between the sites are protected.
crypto ipsec transform-set AES256-SHA256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile SITE-VPN
 set transform-set AES256-SHA256
 set pfs group14
!
interface Tunnel0
 description IPsec tunnel to site C
 ip address 172.16.0.1 255.255.255.252
 tunnel source 203.0.113.1
 tunnel mode ipsec ipv4
 tunnel destination 198.51.100.1
 tunnel protection ipsec profile SITE-VPN
!
interface GigabitEthernet0/0
 description to provider B (b1)
 ip address 203.0.113.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to site A (a1)
 ip address 10.1.0.1 255.255.255.252
!
! Everything else goes to the provider.
ip route 0.0.0.0 0.0.0.0 203.0.113.2
! Site A.
ip route 10.1.0.0 255.255.0.0 10.1.0.2
! Site C, through the tunnel; never to the provider in the clear.
ip route 10.3.0.0 255.255.0.0 Tunnel0
ip route 10.3.0.0 255.255.0.0 Null0 250
!
end
