!
hostname spoke4
!
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 2
 lifetime 28800
!
crypto keyring HUB
  pre-shared-key address 172.20.4.1 key key-spoke4
  local-address 172.20.4.2
!
crypto isakmp profile HUB-PROFILE
   keyring HUB
   match identity address 172.20.4.1 255.255.255.255
   local-address 172.20.4.2
!
crypto ipsec transform-set T256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec transform-set T128 esp-aes esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile PROF
 set transform-set T256
 set pfs group14
!
interface Loopback0
 ip address 10.0.4.1 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 172.20.4.2 255.255.255.252
!
interface Tunnel0
 ip address 10.255.4.2 255.255.255.252
 tunnel source 172.20.4.2
 tunnel mode ipsec ipv4
 tunnel destination 172.20.4.1
 tunnel protection ipsec profile PROF
!
ip route 10.0.0.1 255.255.255.255 Tunnel0
!
end
