!
hostname spoke7
!
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring HUB
  pre-shared-key address 172.20.7.1 key key-spoke7
  local-address 172.20.7.2
!
crypto isakmp profile HUB-PROFILE
   keyring HUB
   match identity address 172.20.7.1 255.255.255.255
   local-address 172.20.7.2
!
crypto ipsec transform-set T256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec transform-set T128 esp-aes esp-sha256-hmac
 mode tunnel
!
crypto map CM 10 ipsec-isakmp
 set peer 172.20.7.1
 set transform-set T256
 set pfs group14
 match address SPOKE-HUB
!
ip access-list extended SPOKE-HUB
 permit ip host 10.0.7.1 host 10.0.0.1
!
interface Loopback0
 ip address 10.0.7.1 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 172.20.7.2 255.255.255.252
 crypto map CM
!
ip route 10.0.0.1 255.255.255.255 172.20.7.1
!
end
