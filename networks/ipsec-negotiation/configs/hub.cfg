  pre-shared-key address 172.20.3.2 key key-spoke3
  local-address 172.20.3.1
!
crypto isakmp profile SPOKE3-PROFILE
   keyring SPOKE3
   match identity address 172.20.3.2 255.255.255.255
   local-address 172.20.3.1
!
crypto keyring SPOKE4
  pre-shared-key address 172.20.4.2 key key-spoke4
  local-address 172.20.4.1
!
crypto isakmp profile SPOKE4-PROFILE
   keyring SPOKE4
   match identity address 172.20.4.2 255.255.255.255
   local-address 172.20.4.1
!
crypto keyring SPOKE5
  pre-shared-key address 172.20.5.2 key key-spoke5
  local-address 172.20.5.1
!
crypto isakmp profile SPOKE5-PROFILE
   keyring SPOKE5
   match identity address 172.20.5.2 255.255.255.255
   local-address 172.20.5.1
!
crypto keyring SPOKE6
  pre-shared-key address 172.20.6.2 key key-spoke6
  local-address 172.20.6.1
!
crypto isakmp profile SPOKE6-PROFILE
   keyring SPOKE6
   match identity address 172.20.6.2 255.255.255.255
   local-address 172.20.6.1
!
crypto keyring SPOKE7
  pre-shared-key address 172.20.7.2 key key-spoke7
  local-address 172.20.7.1
!
crypto isakmp profile SPOKE7-PROFILE
   keyring SPOKE7
   match identity address 172.20.7.2 255.255.255.255
   local-address 172.20.7.1
!
crypto keyring NOWHERE
  pre-shared-key address 192.0.2.99 key key-nowhere
  local-address 10.0.0.1
!
crypto isakmp profile NOWHERE-PROFILE
   keyring NOWHERE
   match identity address 192.0.2.99 255.255.255.255
   local-address 10.0.0.1
!
crypto ipsec transform-set T256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec transform-set T128 esp-aes esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile PROF
 set transform-set T256
 set pfs group14
!
crypto map CM5 10 ipsec-isakmp
 set peer 172.20.5.2
 set transform-set T256
 set pfs group14
 match address HUB-SPOKE5
!
crypto dynamic-map DYN 10
 set transform-set T256
 set pfs group14
 match address HUB-SPOKE7
!
crypto map CM7 10 ipsec-isakmp dynamic DYN
!
ip access-list extended HUB-SPOKE5
 permit ip host 10.0.0.1 host 10.0.5.1
!
ip access-list extended HUB-SPOKE7
 permit ip host 10.0.0.1 host 10.0.7.1
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
!
interface GigabitEthernet0/1
 ip address 172.20.1.1 255.255.255.252
!
interface GigabitEthernet0/2
 ip address 172.20.2.1 255.255.255.252
!
interface GigabitEthernet0/3
 ip address 172.20.3.1 255.255.255.252
!
interface GigabitEthernet0/4
 ip address 172.20.4.1 255.255.255.252
!
interface GigabitEthernet0/5
 ip address 172.20.5.1 255.255.255.252
 crypto map CM5
!
interface GigabitEthernet0/6
 ip address 172.20.6.1 255.255.255.252
!
interface GigabitEthernet0/7
 ip address 172.20.7.1 255.255.255.252
 crypto map CM7
!
interface Tunnel1
 ip address 10.255.1.1 255.255.255.252
 tunnel source 172.20.1.1
 tunnel mode ipsec ipv4
 tunnel destination 172.20.1.2
 tunnel protection ipsec profile PROF
!
interface Tunnel2
 ip address 10.255.2.1 255.255.255.252
 tunnel source 172.20.2.1
 tunnel mode ipsec ipv4
 tunnel destination 172.20.2.2
 tunnel protection ipsec profile PROF
!
interface Tunnel3
 ip address 10.255.3.1 255.255.255.252
 tunnel source 172.20.3.1
 tunnel mode ipsec ipv4
 tunnel destination 172.20.3.2
 tunnel protection ipsec profile PROF
!
interface Tunnel4
 ip address 10.255.4.1 255.255.255.252
 tunnel source 172.20.4.1
 tunnel mode ipsec ipv4
 tunnel destination 172.20.4.2
 tunnel protection ipsec profile PROF
!
interface Tunnel6
 ip address 10.255.6.1 255.255.255.252
 tunnel source 172.20.6.1
 tunnel mode ipsec ipv4
 tunnel destination 172.20.6.2
 tunnel protection ipsec profile PROF
!
interface Tunnel9
 ip address 10.255.9.1 255.255.255.252
 tunnel source 10.0.0.1
 tunnel mode ipsec ipv4
 tunnel destination 192.0.2.99
 tunnel protection ipsec profile PROF
!
ip route 10.0.1.1 255.255.255.255 Tunnel1
ip route 10.0.2.1 255.255.255.255 Tunnel2
ip route 10.0.3.1 255.255.255.255 Tunnel3
ip route 10.0.4.1 255.255.255.255 Tunnel4
ip route 10.0.6.1 255.255.255.255 Tunnel6
ip route 10.0.5.1 255.255.255.255 172.20.5.2
ip route 10.0.7.1 255.255.255.255 172.20.7.2
ip route 10.0.9.1 255.255.255.255 Tunnel9
!
end
