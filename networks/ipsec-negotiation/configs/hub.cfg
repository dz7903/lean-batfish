!
hostname hub
!
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring SPOKE1
  pre-shared-key address 172.20.1.2 key key-spoke1
  local-address 172.20.1.1
!
crypto isakmp profile SPOKE1-PROFILE
   keyring SPOKE1
   match identity address 172.20.1.2 255.255.255.255
   local-address 172.20.1.1
!
crypto keyring SPOKE2
  pre-shared-key address 172.20.2.2 key key-spoke2
  local-address 172.20.2.1
!
crypto isakmp profile SPOKE2-PROFILE
   keyring SPOKE2
   match identity address 172.20.2.2 255.255.255.255
   local-address 172.20.2.1
!
