!
hostname c1
!
interface GigabitEthernet0/0
 description to region B's gateway (gwb)
 ip address 203.0.113.2 255.255.255.252
!
interface GigabitEthernet0/1
 description to c2
 ip address 198.18.0.1 255.255.255.252
!
interface GigabitEthernet0/2
 description to c3
 ip address 198.18.0.9 255.255.255.252
!
router ospf 1
 redistribute static subnets
 network 203.0.113.0 0.0.0.3 area 0
 network 198.18.0.0 0.0.0.3 area 0
 network 198.18.0.8 0.0.0.3 area 0
!
! Region B's address space, announced to the rest of the core.
ip route 100.64.1.0 255.255.255.0 203.0.113.1
!
end
