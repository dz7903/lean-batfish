!
hostname c3
!
interface GigabitEthernet0/0
 description to region D's gateway (gwd)
 ip address 198.51.100.2 255.255.255.252
!
interface GigabitEthernet0/1
 description to c2
 ip address 198.18.0.6 255.255.255.252
!
interface GigabitEthernet0/2
 description to c1
 ip address 198.18.0.10 255.255.255.252
!
router ospf 1
 redistribute static subnets
 network 198.51.100.0 0.0.0.3 area 0
 network 198.18.0.4 0.0.0.3 area 0
 network 198.18.0.8 0.0.0.3 area 0
!
! Region D's address space, announced to the rest of the core.
ip route 100.64.2.0 255.255.255.0 198.51.100.1
!
end
