!
hostname gwe
!
! Site E's gateway. It protects everything for site A with an IPsec tunnel to
! gwa.
!
! IKE phase 1: how gwe and gwa authenticate each other.
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring KEYRING-A
  pre-shared-key address 100.64.1.1 key site-a-to-site-e
  local-address 100.64.2.1
!
crypto isakmp profile TO-A
   keyring KEYRING-A
   match identity address 100.64.1.1 255.255.255.255
   local-address 100.64.2.1
!
! IPsec phase 2: how packets between the sites are protected.
crypto ipsec transform-set AES256-SHA256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile SITE-VPN
 set transform-set AES256-SHA256
 set pfs group14
!
interface Tunnel0
 description IPsec tunnel to site A
 ip address 172.16.15.2 255.255.255.252
 tunnel source 100.64.2.1
 tunnel mode ipsec ipv4
 tunnel destination 100.64.1.1
 tunnel protection ipsec profile SITE-VPN
!
interface GigabitEthernet0/0
 description to region D (d1)
 ip address 100.64.2.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to site E (e1)
 ip address 10.5.0.1 255.255.255.252
!
interface GigabitEthernet0/2
 description to site E (e2)
 ip address 10.5.0.5 255.255.255.252
!
! Everything else goes to region D.
ip route 0.0.0.0 0.0.0.0 100.64.2.2
! Site E.
ip route 10.5.1.0 255.255.255.0 10.5.0.2
ip route 10.5.2.0 255.255.255.0 10.5.0.6
! Site A, through the tunnel; never to region D in the clear.
ip route 10.1.0.0 255.255.0.0 Tunnel0
ip route 10.1.0.0 255.255.0.0 Null0 250
!
end
