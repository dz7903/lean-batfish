!
hostname gwa
!
! Site A's gateway. It is dual-homed to region B (b1, b2) and protects
! everything for site E with an IPsec tunnel to gwe, from its loopback, which
! B routes.
!
! IKE phase 1: how gwa and gwe authenticate each other.
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring KEYRING-E
  pre-shared-key address 100.64.2.1 key site-a-to-site-e
  local-address 100.64.1.1
!
crypto isakmp profile TO-E
   keyring KEYRING-E
   match identity address 100.64.2.1 255.255.255.255
   local-address 100.64.1.1
!
! IPsec phase 2: how packets between the sites are protected.
crypto ipsec transform-set AES256-SHA256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile SITE-VPN
 set transform-set AES256-SHA256
 set pfs group14
!
interface Loopback0
 description tunnel end, in region B's space
 ip address 100.64.1.1 255.255.255.255
!
interface Tunnel0
 description IPsec tunnel to site E
 ip address 172.16.15.1 255.255.255.252
 tunnel source Loopback0
 tunnel mode ipsec ipv4
 tunnel destination 100.64.2.1
 tunnel protection ipsec profile SITE-VPN
!
interface GigabitEthernet0/0
 description to region B (b1)
 ip address 100.64.1.9 255.255.255.252
!
interface GigabitEthernet0/1
 description to region B (b2)
 ip address 100.64.1.13 255.255.255.252
!
interface GigabitEthernet0/2
 description to site A (a1)
 ip address 10.1.0.1 255.255.255.252
!
interface GigabitEthernet0/3
 description to site A (a2)
 ip address 10.1.0.5 255.255.255.252
!
! Everything else goes to region B, over both uplinks.
ip route 0.0.0.0 0.0.0.0 100.64.1.10
ip route 0.0.0.0 0.0.0.0 100.64.1.14
! Site A.
ip route 10.1.1.0 255.255.255.0 10.1.0.2
ip route 10.1.2.0 255.255.255.0 10.1.0.6
! Site E, through the tunnel; never to region B in the clear.
ip route 10.5.0.0 255.255.0.0 Tunnel0
ip route 10.5.0.0 255.255.0.0 Null0 250
!
end
