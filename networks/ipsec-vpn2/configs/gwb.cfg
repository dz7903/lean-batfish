!
hostname gwb
!
! Region B's gateway to the core C. It protects everything for region D with
! an IPsec tunnel to gwd.
!
! IKE phase 1: how gwb and gwd authenticate each other.
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 28800
!
crypto keyring KEYRING-D
  pre-shared-key address 198.51.100.1 key region-b-to-region-d
  local-address 203.0.113.1
!
crypto isakmp profile TO-D
   keyring KEYRING-D
   match identity address 198.51.100.1 255.255.255.255
   local-address 203.0.113.1
!
! IPsec phase 2: how packets between the regions are protected.
crypto ipsec transform-set AES128-SHA esp-aes esp-sha-hmac
 mode tunnel
!
crypto ipsec profile REGION-VPN
 set transform-set AES128-SHA
 set pfs group14
!
interface Tunnel0
 description IPsec tunnel to region D
 ip address 172.16.24.1 255.255.255.252
 tunnel source 203.0.113.1
 tunnel mode ipsec ipv4
 tunnel destination 198.51.100.1
 tunnel protection ipsec profile REGION-VPN
!
interface GigabitEthernet0/0
 description to the core (c1)
 ip address 203.0.113.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to b1
 ip address 100.64.1.18 255.255.255.252
!
interface GigabitEthernet0/2
 description to b2
 ip address 100.64.1.22 255.255.255.252
!
! Everything else goes to the core.
ip route 0.0.0.0 0.0.0.0 203.0.113.2
! Region B, over both routers.
ip route 100.64.1.0 255.255.255.0 100.64.1.17
ip route 100.64.1.0 255.255.255.0 100.64.1.21
! Region D, through the tunnel; never to the core in the clear.
ip route 100.64.2.0 255.255.255.0 Tunnel0
ip route 100.64.2.0 255.255.255.0 Null0 250
!
end
